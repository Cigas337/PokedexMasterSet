name: Inspect Pokedex toolbar DOM

on:
  push:
    branches: [qa-v155-live-smoke]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Inspect live Pokedex
        env:
          LIVE_URL: https://cigas337.github.io/PokedexMasterSet/
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:393,height:852},isMobile:true,hasTouch:true});
            await page.goto(process.env.LIVE_URL,{waitUntil:'domcontentloaded',timeout:60000});
            await page.evaluate(async()=>{if('serviceWorker'in navigator)await navigator.serviceWorker.ready}).catch(()=>{});
            await page.reload({waitUntil:'domcontentloaded',timeout:60000});
            await page.evaluate(async()=>{if(typeof unlockApp==='function')await unlockApp()});
            await page.locator('[data-app-nav="portfolio"]').click();
            await page.waitForTimeout(1000);
            const out=await page.evaluate(()=>{
              const controls=document.querySelector('#m7PortfolioView .controls');
              const stage=document.querySelector('#m7PortfolioView .stage');
              const headerCandidates=[...document.querySelectorAll('h1,h2,.brand,.logo,.m7-brand,.m7-app-header,.topbar,.header')].slice(0,40).map(el=>({tag:el.tagName,id:el.id,cls:String(el.className||''),text:(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,160)}));
              const summarize=el=>({tag:el.tagName,id:el.id,cls:String(el.className||''),text:(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,180),html:el.outerHTML.slice(0,1200)});
              return {
                controls:controls?{
                  html:controls.outerHTML.slice(0,12000),
                  children:[...controls.children].map(summarize),
                  all:[...controls.querySelectorAll('input,select,button,a')].map(el=>({tag:el.tagName,id:el.id,cls:String(el.className||''),type:el.type||'',name:el.name||'',value:el.value||'',text:(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,120),placeholder:el.placeholder||'',aria:el.getAttribute('aria-label')||''}))
                }:null,
                stageHead:stage?.querySelector('.stage-head')?.outerHTML?.slice(0,4000)||'',
                headerCandidates
              };
            });
            console.log('POKEDEX_DOM_START');
            console.log(JSON.stringify(out,null,2));
            console.log('POKEDEX_DOM_END');
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
