name: Mobile UX baseline audit

on:
  push:
    branches: [qa-v155-live-smoke]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Audit mobile views
        env:
          LIVE_URL: https://cigas337.github.io/PokedexMasterSet/
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const vp of [{name:'iphone14pro',width:393,height:852},{name:'iphoneProMax',width:430,height:932},{name:'small',width:360,height:780}]){
              const page=await browser.newPage({viewport:{width:vp.width,height:vp.height},isMobile:true,hasTouch:true});
              await page.goto(process.env.LIVE_URL,{waitUntil:'domcontentloaded',timeout:60000});
              await page.evaluate(async()=>{if('serviceWorker'in navigator)await navigator.serviceWorker.ready}).catch(()=>{});
              await page.reload({waitUntil:'domcontentloaded',timeout:60000});
              await page.evaluate(async()=>{if(typeof unlockApp==='function')await unlockApp()});
              await page.waitForTimeout(1200);
              console.log('\nVIEWPORT',JSON.stringify(vp));
              const views=['portfolio','search','shop','expansions','profile'];
              for(const view of views){
                const btn=page.locator(`[data-app-nav="${view}"]`);
                if(await btn.count())await btn.click();
                await page.waitForTimeout(view==='shop'||view==='expansions'?1000:350);
                const m=await page.evaluate((view)=>{
                  const nav=document.querySelector('.m7-app-nav');
                  const nr=nav?.getBoundingClientRect();
                  const visible=[...document.querySelectorAll('body *')].filter(el=>{
                    const s=getComputedStyle(el),r=el.getBoundingClientRect();
                    return s.display!=='none'&&s.visibility!=='hidden'&&r.width>1&&r.height>1;
                  });
                  const overflow=visible.filter(el=>{const r=el.getBoundingClientRect();return r.left<-2||r.right>innerWidth+2}).slice(0,12).map(el=>({tag:el.tagName,id:el.id,cls:String(el.className||'').slice(0,90),left:Math.round(el.getBoundingClientRect().left),right:Math.round(el.getBoundingClientRect().right),w:Math.round(el.getBoundingClientRect().width)}));
                  const bottomCovered=visible.filter(el=>{
                    if(!nr||el===nav||nav.contains(el))return false;
                    const r=el.getBoundingClientRect();
                    return r.bottom>nr.top && r.top<innerHeight && r.width>40 && r.height>20;
                  }).slice(0,10).map(el=>({tag:el.tagName,id:el.id,cls:String(el.className||'').slice(0,80),top:Math.round(el.getBoundingClientRect().top),bottom:Math.round(el.getBoundingClientRect().bottom)}));
                  return {
                    view,
                    bodyScrollWidth:document.documentElement.scrollWidth,
                    viewport:innerWidth,
                    nav:nr&&{top:Math.round(nr.top),bottom:Math.round(nr.bottom),height:Math.round(nr.height),gapBottom:Math.round(innerHeight-nr.bottom)},
                    overflow,
                    bottomCovered,
                    active:document.body.dataset.m7View||''
                  };
                },view);
                console.log('AUDIT',JSON.stringify(m));
              }
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
