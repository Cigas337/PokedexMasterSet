name: Verify v15.8 integration live

on:
  push:
    branches: [qa-v155-live-smoke]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify public v15.8
        env:
          LIVE_URL: https://cigas337.github.io/PokedexMasterSet/
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:393,height:852},isMobile:true,hasTouch:true});
            const pageErrors=[];page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto(process.env.LIVE_URL,{waitUntil:'domcontentloaded',timeout:30000});
            await sleep(700);

            const version=await page.evaluate(async()=>await (await fetch('./v15.8.js?v=15.8.0',{cache:'reload'})).text());
            if(!version.includes('v15.8.0 · Integration polish'))throw new Error('v15.8 runtime is not live');

            const auth=await page.evaluate(()=>{const el=document.querySelector('#authGate .m7-v158-auth-signature');return el?{text:el.textContent.trim().replace(/\s+/g,' '),em:el.querySelector('em')?.textContent||'',cls:el.className}:null});
            console.log('AUTH',JSON.stringify(auth));
            if(!auth||auth.text!=='Signed by Cigas · Unofficial fan project · “Legendary as ♥♥♥♥”'||auth.em!=='Unofficial fan project')throw new Error('login signature mismatch');

            const avatarData='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" fill="#56d8d2"/><circle cx="32" cy="25" r="13" fill="#071019"/><path d="M10 64c3-18 14-27 22-27s19 9 22 27" fill="#071019"/></svg>');
            await page.evaluate(data=>localStorage.setItem('pokedexm7-v15-avatar',data),avatarData);
            await page.reload({waitUntil:'domcontentloaded',timeout:30000});
            await sleep(700);
            await page.evaluate(()=>{try{if(typeof unlockApp==='function')void unlockApp()}catch(_){}});
            await sleep(1700);

            const avatar=await page.evaluate(()=>{
              const btn=document.querySelector('.m7-app-nav [data-app-nav="profile"]'),holder=btn?.querySelector('.m7-v158-nav-avatar'),img=holder?.querySelector('img'),svg=btn?.querySelector(':scope > svg');
              if(!btn||!holder||!img)return null;const r=holder.getBoundingClientRect(),s=getComputedStyle(holder);
              return {label:btn.querySelector('span:last-child')?.textContent?.trim(),has:btn.classList.contains('m7-v158-has-avatar'),hidden:holder.hidden,w:Math.round(r.width),h:Math.round(r.height),radius:s.borderRadius,svgDisplay:svg?getComputedStyle(svg).display:'none',src:img.getAttribute('src')||''};
            });
            console.log('AVATAR',JSON.stringify(avatar));
            if(!avatar||avatar.label!=='Profile'||!avatar.has||avatar.hidden||avatar.w<24||avatar.h<24||avatar.radius!=='50%'||avatar.svgDisplay!=='none'||!avatar.src.startsWith('data:image/svg+xml'))throw new Error('profile dock avatar failed');

            const promo=await page.evaluate(async()=>{
              const img=document.createElement('img');img.id='qaPromo029';img.src='https://images.pokemontcg.io/mep/029_hires.png';document.body.appendChild(img);
              await new Promise(r=>setTimeout(r,1300));
              return {src:img.getAttribute('src')||'',fixed:img.dataset.m7V158PromoFixed||'',naturalWidth:img.naturalWidth};
            });
            console.log('PROMO',JSON.stringify(promo));
            if(promo.src!=='https://pkmncards.com/wp-content/uploads/mebsp_en_029_std.png'||promo.fixed!=='1'||promo.naturalWidth<100)throw new Error('Charizard MEP 029 art repair failed');
            await page.evaluate(()=>document.getElementById('qaPromo029')?.remove());

            const seeded=await page.evaluate(()=>{
              const oldAll=window.__all,oldGet=window.getCardDetails;
              window.__qaOldAll=oldAll;window.__qaOldGet=oldGet;
              window.__all=[{id:6}];
              window.getCardDetails=()=>({owned:{qa:{id:'base1-4',tcgdexOriginalId:'base1-4',name:'Charizard',number:'004',setCode:'base1',setName:'Base Set'}}});
              return {allIsArray:Array.isArray(window.__all),getType:typeof window.getCardDetails};
            });
            console.log('SEEDED',JSON.stringify(seeded));
            await page.evaluate(()=>document.querySelector('[data-app-nav="expansions"]')?.click());
            await sleep(2300);
            await page.evaluate(()=>{const q=document.getElementById('v155SetQuery');if(q){q.value='Base Set';q.dispatchEvent(new Event('input',{bubbles:true}))}});
            await sleep(350);
            const summary=await page.evaluate(()=>{
              const b=document.querySelector('[data-v155-set="base1"]')||[...document.querySelectorAll('[data-v155-set]')].find(x=>(x.textContent||'').includes('Base Set'));
              return b?{id:b.dataset.v155Set,text:b.textContent.trim().replace(/\s+/g,' ')}:null;
            });
            console.log('EXP_SUMMARY',JSON.stringify(summary));
            if(!summary||!/1 de \d+/.test(summary.text))throw new Error('Expansions summary did not inherit owned card');

            await page.evaluate(()=>{const b=document.querySelector('[data-v155-set="base1"]')||[...document.querySelectorAll('[data-v155-set]')].find(x=>(x.textContent||'').includes('Base Set'));b?.click()});
            await sleep(2300);
            const detail=await page.evaluate(()=>({count:document.getElementById('v155DetailCount')?.textContent?.trim().replace(/\s+/g,' ')||'',owned:[...document.querySelectorAll('#v155Cards .m7-v155-card.owned')].map(x=>x.textContent.trim().replace(/\s+/g,' ').slice(0,160)).slice(0,5)}));
            console.log('EXP_DETAIL',JSON.stringify(detail));
            if(!/^1 de \d+/.test(detail.count)||!detail.owned.some(x=>/Charizard/i.test(x)))throw new Error('Expansion detail did not inherit Charizard ownership');

            const sw=await page.evaluate(async()=>{if(!('serviceWorker'in navigator))return '';const r=await navigator.serviceWorker.ready;return r.active?.scriptURL||''});
            console.log('SW',sw);
            console.log('PAGE_ERRORS',JSON.stringify(pageErrors));
            if(pageErrors.length)throw new Error('page errors: '+JSON.stringify(pageErrors));
            await browser.close();console.log('V158_ALL_PASS');
          })().catch(e=>{console.error('V158_FAILED',e.stack||e);process.exit(1)});
          NODE
