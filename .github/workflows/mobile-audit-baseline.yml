name: Inspect login footer before v15.8

on:
  push:
    branches: [qa-v155-live-smoke]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Inspect login DOM
        env:
          LIVE_URL: https://cigas337.github.io/PokedexMasterSet/
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:393,height:852},isMobile:true,hasTouch:true});
            await page.goto(process.env.LIVE_URL,{waitUntil:'domcontentloaded',timeout:25000});
            const out=await page.evaluate(()=>{
              const gate=document.getElementById('authGate');
              if(!gate)return null;
              const nodes=[...gate.querySelectorAll('*')].filter(el=>!el.children.length&&(el.textContent||'').trim()).map(el=>({tag:el.tagName,id:el.id,cls:String(el.className||''),text:(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,300)}));
              return {html:gate.outerHTML.slice(0,16000),leaves:nodes};
            });
            console.log('AUTH_INSPECT_START');console.log(JSON.stringify(out,null,2));console.log('AUTH_INSPECT_END');
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
