name: Live smoke v15.5

on:
  push:
    branches:
      - qa-v155-live-smoke

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Identify HTTP failures after required navigation
        env:
          LIVE_URL: https://cigas337.github.io/PokedexMasterSet/
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:390,height:844}});
            const bad=[];
            page.on('response', r => { if(r.status() >= 400) bad.push({status:r.status(),url:r.url(),type:r.request().resourceType()}); });
            page.on('requestfailed', r => bad.push({status:'FAILED',url:r.url(),type:r.resourceType(),error:r.failure()?.errorText||''}));
            await page.goto(process.env.LIVE_URL,{waitUntil:'domcontentloaded',timeout:60000});
            await page.evaluate(async()=>{if('serviceWorker'in navigator)await navigator.serviceWorker.ready}).catch(()=>{});
            await page.reload({waitUntil:'domcontentloaded',timeout:60000});
            await page.evaluate(async()=>{ if(typeof unlockApp==='function') await unlockApp(); });
            await page.waitForTimeout(1200);

            console.log('TEST 1 SHOP');
            await page.locator('[data-app-nav="shop"]').click();
            await page.waitForFunction(()=>document.querySelectorAll('#stockBody .stock-card').length>0,null,{timeout:30000});
            console.log('SHOP',await page.locator('#stockBody .stock-card').count());

            console.log('TEST 2 POKEDEX');
            await page.locator('[data-app-nav="portfolio"]').click();
            await page.waitForFunction(()=>/Pokédex Nacional/i.test(document.querySelector('#m7PortfolioView .stage-head h2')?.textContent||''),null,{timeout:10000});
            console.log('POKEDEX_OK');

            console.log('TEST 3 EXPANSIONS');
            await page.locator('[data-app-nav="expansions"]').click();
            await page.waitForFunction(()=>document.querySelectorAll('#v155SetResults .m7-v155-set').length>0,null,{timeout:35000});
            console.log('EXPANSIONS',await page.locator('#v155SetResults .m7-v155-set').count());
            await page.waitForTimeout(2500);

            const unique=[...new Map(bad.map(x=>[`${x.status}|${x.url}`,x])).values()];
            console.log('BAD_HTTP_BEGIN');
            for(const x of unique) console.log(JSON.stringify(x));
            console.log('BAD_HTTP_END');
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
