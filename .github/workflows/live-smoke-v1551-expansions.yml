name: Live smoke v15.5.1 expansions

on:
  push:
    branches:
      - qa-v155-live-smoke

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify live expansions
        env:
          LIVE_URL: https://cigas337.github.io/PokedexMasterSet/
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:390,height:844}});
            await page.goto(process.env.LIVE_URL,{waitUntil:'domcontentloaded',timeout:60000});
            await page.evaluate(async()=>{if('serviceWorker'in navigator)await navigator.serviceWorker.ready}).catch(()=>{});
            await page.reload({waitUntil:'domcontentloaded',timeout:60000});
            await page.evaluate(async()=>{if(typeof unlockApp==='function')await unlockApp()});
            await page.waitForTimeout(1200);
            await page.locator('[data-app-nav="expansions"]').click();
            await page.waitForFunction(()=>document.querySelectorAll('#v155SetResults .m7-v155-set').length>0,null,{timeout:35000});
            await page.waitForTimeout(2500);

            const first = await page.locator('#v155SetResults .m7-v155-set').evaluateAll(nodes => nodes.slice(0,8).map(n => ({id:n.dataset.v155Set,name:n.querySelector('strong')?.textContent?.trim()||''})));
            const withDates = [];
            for (const row of first.slice(0,6)) {
              const data = await page.evaluate(async id => {
                const r = await fetch(`https://api.tcgdex.net/v2/en/sets/${encodeURIComponent(id)}`,{cache:'no-store'});
                if(!r.ok)return {id,status:r.status,releaseDate:''};
                const j=await r.json();return {id,status:r.status,releaseDate:j.releaseDate||''};
              }, row.id);
              withDates.push({...row,...data});
            }
            console.log('FIRST_SETS',JSON.stringify(withDates));
            const dated=withDates.filter(x=>x.releaseDate).map(x=>x.releaseDate);
            const sorted=[...dated].sort((a,b)=>b.localeCompare(a));
            if(JSON.stringify(dated)!==JSON.stringify(sorted))throw new Error(`Expansions are not newest-first: ${JSON.stringify(dated)}`);

            const imageState = await page.locator('#v155SetResults').evaluate(holder => {
              const imgs=[...holder.querySelectorAll('.m7-v155-set-image img')];
              return {
                total:imgs.length,
                visibleBroken:imgs.filter(img=>getComputedStyle(img).display!=='none' && img.naturalWidth===0).length,
                loaded:imgs.filter(img=>img.naturalWidth>0).length,
                textFallbacks:holder.querySelectorAll('.m7-v155-set-image .fallback-name').length
              };
            });
            console.log('IMAGE_STATE',JSON.stringify(imageState));
            if(imageState.visibleBroken>0)throw new Error(`There are ${imageState.visibleBroken} visibly broken set images`);
            console.log('EXPANSIONS_V1551_PASS');
            await browser.close();
          })().catch(e=>{console.error('SMOKE_FAILED',e.stack||e);process.exit(1)});
          NODE
