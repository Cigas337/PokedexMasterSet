name: Apply Pokédex M7 v14.0.2 push auth hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v14-0-2-push-auth-hotfix.yml'
      - 'scripts/apply_v14_0_2_push_auth_hotfix.py'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply hotfix
        run: python scripts/apply_v14_0_2_push_auth_hotfix.py

      - name: Validate embedded JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          for i,code in enumerate(scripts):
              if not code.strip(): continue
              p=Path(f'/tmp/pokedex-script-{i}.js')
              p.write_text(code,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          subprocess.run(['node','--check','sw.js'],check=True)
          print('JavaScript validation OK')
          PY

      - name: Commit hotfix
        run: |
          if git diff --quiet -- index.html sw.js; then
            echo 'No hotfix changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'fix: send publishable key to Push API in v14.0.2'
          git push
