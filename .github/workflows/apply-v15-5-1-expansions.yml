name: Apply v15.5.1 expansions update

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-v15-5-1-expansions.yml'
      - 'scripts/apply_v15_5_1_expansions.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply expansions update
        run: python3 scripts/apply_v15_5_1_expansions.py

      - name: Validate JavaScript
        run: node --check v15.5.js

      - name: Validate newest-first sorting and image fallbacks
        run: |
          grep -q 'sort:field=releaseDate&sort:order=DESC' v15.5.js
          grep -q 'data-v155-image-alt' v15.5.js
          grep -q 'pokedexm7-shell-v15.5.1' sw.js

      - name: Commit update
        run: |
          if git diff --quiet; then
            echo 'Already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v15.5.js sw.js
          git commit -m 'feat: newest-first expansions and resilient images'
          git push
