name: Apply v15.10.1 expansion image patch

on:
  push:
    branches: [main]
    paths:
      - 'v15.10.1.js'
      - 'scripts/apply_v15_10_1_image_patch.py'
      - '.github/workflows/apply-v15-10-1-image-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate image patch
        run: |
          node --check v15.10.1.js
          python3 -m py_compile scripts/apply_v15_10_1_image_patch.py
          grep -q 'XMLHttpRequest' v15.10.1.js
          grep -q 'api.tcgdex.net/v2/en' v15.10.1.js
          grep -q 'low.webp' v15.10.1.js
          grep -q 'm7-v155-card-img' v15.10.1.js
      - name: Activate patch
        run: python3 scripts/apply_v15_10_1_image_patch.py
      - name: Validate activated shell
        run: |
          node --check v15.10.js
          node --check v15.10.1.js
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          assert html.count('v15.10.1.js') == 1
          assert 'v15.10.1.js?v=15.10.1' in html
          assert html.index('v15.10.js') < html.index('v15.10.1.js')
          assert "pokedexm7-shell-v15.10.1-rc1" in sw
          assert "'./v15.10.1.js'" in sw
          print('v15.10.1 image patch validation OK')
          PY
      - name: Commit activation
        run: |
          if git diff --quiet; then
            echo 'Already active.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'fix: activate v15.10.1 expansion image recovery'
          git push
