name: Apply v15.7.1 toolbar hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v15-7-1-hotfix.yml'
      - 'scripts/apply_v15_7_1_hotfix.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply hotfix
        run: python3 scripts/apply_v15_7_1_hotfix.py
      - name: Validate hotfix
        run: |
          node --check v15.7.js
          python3 - <<'PY'
          from pathlib import Path
          js=Path('v15.7.js').read_text(encoding='utf-8')
          html=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          assert 'v15.7.1 · Professional Pokédex toolbar' in js
          assert "if(parentId===lastParentId)return" in js
          assert "if(count.textContent!==nextCount)" in js
          assert 'v15.7.js?v=15.7.1' in html
          assert 'v15.7.css?v=15.7.1' in html
          assert "pokedexm7-shell-v15.7.1" in sw
          print('v15.7.1 validation OK')
          PY
      - name: Commit activation
        run: |
          if git diff --quiet; then
            echo 'Already active.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'fix: activate stable Pokedex toolbar v15.7.1'
          git push
